name: Validate Godot scenario

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-godot.yml'
      - 'game/**'
      - 'content/contacts/**'
      - 'project.godot'
      - 'tests/scenario/**'
      - 'tools/validate_content.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validate authored content references
        run: python3 tools/validate_content.py

      - name: Get Godot 4.7.2 standard Linux executable
        run: |
          curl -fL --retry 4 --retry-delay 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Import project resources
        run: |
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --import

      - name: Check scenario harness parses
        run: |
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . \
            --check-only --script res://tests/scenario/run_campaign.gd

      - name: Complete campaign scenario harness
        run: |
          timeout 75 /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . \
            --script res://tests/scenario/run_campaign.gd

      - name: Main scene boot smoke check
        run: |
          timeout 20 /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --quit-after 30
